releaseNotes: >-
  The home screen is rebuilt around what is actually next.


  - "Next up" now spans the full width instead of sharing a row, and long
    event titles step down in size rather than overflowing.

  - An event shared by two or more people appears once, in a "Together" lane,
    with everyone's name under it. Previously it was repeated in each person's
    column. The lanes resize to however many columns there are.

  - The photo sits above the chores and shopping cards, which are now side by
    side, and the outside conditions moved to the top right.

  - The per-person strip along the top, showing who is home and their status
    text, is gone. The home/away styling still appears on the Ambient screen,
    but a person's `status` text in config.json no longer displays anywhere.

  - Chore rings are smaller, so a family of four fits without scrolling.


  No configuration or data changes. Nothing to do beyond updating.
dependencies: []
path: ""
torOnly: false
