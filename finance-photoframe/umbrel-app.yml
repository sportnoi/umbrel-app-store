releaseNotes: >-
  Photos are no longer cropped, so nobody gets cut out of frame.


  - Every photo was resized to fill the slot exactly, with the crop placed by
    an automatic "most interesting region" guess. On family photos that guess
    regularly cut people out at the edges. Photos are now shrunk to fit inside
    the slot and framed on screen by their real shape, portrait or landscape.

  - Photos already shown are re-rendered rather than served from cache, so the
    old cropped versions do not linger in the browser for a week.


  The thumbnail cache is rebuilt under new filenames. The previous cropped
  files stay in the app's data directory without ever being read again — see
  the app store README if you want to reclaim that space. Nothing breaks if
  you leave them.
