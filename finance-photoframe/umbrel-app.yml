releaseNotes: >-
  Photo dates were a day out, and captions now say how long ago.


  - Every photo's date was shifted a day earlier. The date was derived by
    converting to UTC, which rolls back the calendar day for any timezone
    ahead of UTC. It is now read in local time.

  - Photos with no EXIF date fall back to a date in the file name
    ("2024-08-19 10.20.30.jpg"), and only then to the file's modified time.
    Photos exported by a tool that strips EXIF now land on the right day.

  - Captions read "Yesterday", "4 days ago", "3 weeks ago", "5 months ago" or
    "2y 3m ago" instead of only "N years ago" or "This year".

  - "On this day" no longer appears on photos taken today; it needs a previous
    year to be worth saying.

  - Captions for photos with no place no longer show a dangling separator, and
    the home card falls back to the date instead of an empty line.

  - Removing an "@name" tag could leave the separator behind, so
    "@diana - Dentist" displayed as "- Dentist". The title is tidied now.

  - The text on an empty "Next up" card was clipped at the bottom.


  On first start the photo cache is rebuilt, because the stored dates are the
  wrong ones. Expect the first slideshow load to take a little longer while
  EXIF is re-read; nothing needs clearing by hand.
