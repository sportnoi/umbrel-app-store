releaseNotes: >-
  The calendar opens on the week, and events can assign themselves to people.


  - The calendar now opens in Week view instead of Today. The Today, 3 Day,
    Week and Month buttons are unchanged.

  - Writing "@diana" or "@santi @vicky" in an event's title or description
    assigns that event to those people, and the tag is stripped from the title
    before it is displayed. Useful for a shared feed where only some events
    belong to one person.

    Tags match a person's `id` or their `name`, case-insensitively, and only
    where the name is a single word — a person called "Parent 1" can only be
    tagged by id, because the tag stops at the space. Untagged events still go
    to everyone, as before.


  No configuration or data changes. Nothing to do beyond updating.
dependencies: []
path: ""
torOnly: false
