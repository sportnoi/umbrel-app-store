releaseNotes: >-
  The frame picks up a new release on its own.


  - The server now reports an identifier for the build it is serving, and the
    dashboard compares it against the one it loaded with. When they differ, a
    new release is running and the page reloads itself, so a tablet on the
    wall no longer shows the previous version until someone walks over and
    refreshes it.

  - It waits for a good moment: nothing reloads while a panel is open, and
    unsaved changes are written out first.

  The check rides on the existing three-minute refresh, so a frame updates
  itself within a few minutes of the app restarting.


  This release is the one that installs the mechanism, so it cannot use it.
  Reload the frame once by hand after updating to 0.1.5; releases after this
  one take care of themselves.
dependencies: []
path: ""
torOnly: false
