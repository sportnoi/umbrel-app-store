# `version` is a no-op under the Compose V2 plugin that umbrelOS ships —
# kept to match the upstream app repo's compose file.
version: "3.7"

services:
  # ---------------------------------------------------------------------------
  # Umbrel's reverse proxy. Publishes the app on the host at the `port:`
  # declared in umbrel-app.yml (3333) and puts it on the dashboard. This is the
  # only service reachable from outside the app's Docker network.
  #
  # Note: no `container_name:` or custom `networks:` anywhere in this file.
  # Upstream uses `container_name: finance-*` on the `finance_net` network;
  # umbrelOS names containers itself as <app-id>_<service>_1 and manages the
  # app network, and app_proxy cannot find the app if either is overridden.
  # ---------------------------------------------------------------------------
  app_proxy:
    environment:
      APP_HOST: finance-casa_frontend_1
      APP_PORT: 3000
      # Nginx Proxy Manager compatibility:
      # Umbrel normally injects its own auth/session layer in front of the app.
      # That layer misbehaves when the app is fronted by an external reverse
      # proxy on a real hostname, so it is disabled here and the app's own
      # login (login.html / login.js) is the gate.
      #
      # !! Consequence: anyone who can reach http://<umbrel-ip>:3333 lands on
      # the app's own login screen with no Umbrel auth in front of it. Set this
      # back to "true" if you are not fronting the app with NPM.
      PROXY_AUTH_ADD: "false"

  # ---------------------------------------------------------------------------
  # Next.js frontend — the only service the proxy talks to.
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/sportnoi/home-finance-tracker-frontend:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Same value as upstream. Compose registers `backend` as a network alias
      # for the backend service, so this resolves without hardcoding the
      # umbrelOS container name.
      BACKEND_URL: http://backend:8080
      NODE_ENV: production
      TZ: ${TZ:-UTC}

  # ---------------------------------------------------------------------------
  # Python backend (stdlib-only server.py). Internal only — no `ports:`, so
  # nothing on the LAN can reach it, only `frontend` on this app's network.
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/sportnoi/home-finance-tracker-backend:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    environment:
      FINANCE_DB_PATH: /data/finance.db
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-UTC}
    volumes:
      # Holds finance.db. Shared with telegram-bot, exactly as upstream does.
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      # A TCP connect, not an HTTP path — server.py's routes are not assumed.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8080), timeout=3).close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Telegram bot for quick expense/income entry. Writes to the same SQLite file
  # as the backend. Internal only; nothing else depends on it.
  #
  # Requires a bot token. umbrelOS has no UI for app secrets, so create
  #   /home/umbrel/umbrel/app-data/finance-casa/.env
  # containing:
  #   TELEGRAM_BOT_TOKEN=123456:ABC...
  # then restart the app. Compose reads .env from the app's data directory.
  # Until it is set this container restarts in a loop; the backend and frontend
  # are unaffected. Remove this service entirely if you do not want the bot.
  # ---------------------------------------------------------------------------
  telegram-bot:
    image: ghcr.io/sportnoi/home-finance-tracker-telegram-bot:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FINANCE_DB_PATH: /data/finance.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-UTC}
    volumes:
      - ${APP_DATA_DIR}/data:/data
