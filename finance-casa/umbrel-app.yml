releaseNotes: >-
  Investments are money moved, not money spent — and each account can now
  record what you put into it.


  - The savings rate ran backwards: every contribution lowered it by exactly
    the amount saved, because investments were counted as spending while also
    being counted separately as contributions. They are excluded now. The
    pay-cycle budget still counts them, deliberately — a contribution really
    has left your cash before payday.

  - "Registrar aporte" on an investment account writes one expense that feeds
    four figures: the account's cost basis, the month's contribution when it
    closes, the FI model, and the Sankey.

  - Ganancia / Perdida reported your whole portfolio as profit whenever the
    cost basis was unset, because an empty field read as zero invested. It now
    says when it cannot answer, and scopes the gain to the accounts that can.

  - Expenses can be marked as investments from the web app. Previously only
    the Telegram bot could set that flag.

  - Each account shows the date of the balance it is quoting, so a figure from
    months ago no longer reads like today's.

  - The Gastos table gets the full page width, which on a wide monitor was
    capped at 1280px and cut off the amount column and the row buttons.


  Schema: two columns added to wealth_accounts, applied on first start.
  Existing accounts behave exactly as before until you link a category.
  Back up before updating.

