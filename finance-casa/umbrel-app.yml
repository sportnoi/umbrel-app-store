manifestVersion: 1
id: finance-casa
name: Finance Casa
tagline: Self-hosted home finance tracking, with a Telegram bot for quick entry
category: finance
version: "1.0.2"
port: 3333
description: >-
  Finance Casa is a self-hosted home finance tracker that keeps your household's
  financial picture on hardware you own.


  A Next.js frontend sits in front of a small dependency-free Python API, with
  everything stored in a single SQLite database inside the app's data directory.
  Nothing leaves the device unless you choose to expose it.


  Features:

  - Dashboard view of your current position

  - Income tracking (ingresos)

  - Budgets (presupuesto)

  - A Telegram bot for logging expenses and income from your phone, writing to
    the same database as the web UI


  The Telegram bot needs a bot token before it will start — see the app store
  README for where to put it. The web UI works without it.
