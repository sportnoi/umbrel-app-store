releaseNotes: >-
  Tools for working through a backlog of uncategorised expenses, and a
  spreadsheet importer you can run on the Umbrel itself.


  - Sin Categoria is now a queue: the backlog is ordered by date rather than
    amount, so you file what you still remember, and the assign dropdown is
    sorted by name.

  - Duplicate categories can finally be cleaned up. Combining one into another
    moves every expense across for all users, reparents children and repoints
    budgets — summing them when both sides hold one for the same period, and
    telling you it did. Sin Categoria itself is refused: the importer needs
    somewhere to put rows it cannot classify.

  - Import a month of expenses from the planning workbook, run from the Umbrel
    over SSH. Dry run by default, and the dry run now reports what it would
    actually insert rather than what it parsed — the number a decision to
    re-import depends on.

  - The category action reads "Combinar" throughout.


  Schema changes apply automatically on first start and are additive. Back up
  before updating.

dependencies: []
