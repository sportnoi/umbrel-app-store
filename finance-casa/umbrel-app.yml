releaseNotes: >-
  Finding things: a misfiled expense, and a category by any word in its name.


  - Type any part of a category name to find it. "Deportes" now reaches
    "Gimnasio y Deportes", and accents and case are ignored, so "futbol" finds
    "Camisetas Futbol". Replaces every category dropdown in the app — the
    backlog, the dashboard filter, both sides of Combinar, and the expense edit
    dialog.

  - Filter the dashboard by date range, and by expenses you have edited since
    they arrived. That second one is the misclick finder: it matches rows
    changed after they were created, which is exactly the set you filed by hand.

  - The dashboard's category filter is sorted by name, like the others.


  No schema changes.

dependencies: []
