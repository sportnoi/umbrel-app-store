manifestVersion: 1
id: finance-casa
name: Finance Casa
tagline: Self-hosted home finance tracking, with a Telegram bot for quick entry
category: finance
version: "1.2.1"
port: 3333
description: >-
  Finance Casa is a self-hosted home finance tracker that keeps your household's
  financial picture on hardware you own.


  A Next.js frontend sits in front of a small dependency-free Python API, with
  everything stored in a single SQLite database inside the app's data directory.
  Nothing leaves the device unless you choose to expose it.


  Features:

  - Dashboard view of your current position

  - Income tracking (ingresos)

  - Budgets (presupuesto)

  - A Telegram bot for logging expenses and income from your phone, writing to
    the same database as the web UI


  The Telegram bot needs a bot token before it will start — see the app store
  README for where to put it. The web UI works without it.
developer: Santiago Portnoi
website: https://finance.casa
submitter: Santiago Portnoi
submission: https://github.com/sportnoi/umbrel-app-store
repo: https://github.com/sportnoi/home-finance-tracker
support: https://github.com/sportnoi/home-finance-tracker/issues
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
releaseNotes: >-
  Fixes the Telegram bot crash-looping after 1.2.0.


  categorization.py was split out of telegram_bot.py in 1.2.0 but never added to
  the bot image's file list, so the module was missing and the container died on
  import every time it started. The web app was unaffected.


  The build guard that exists for exactly this mistake only ever checked the
  backend image; it now covers both, and follows imports transitively — a copied
  file importing a copied file that imports a missing one fails just as hard.


  No other changes. Everything in 1.2.0 is unaffected.

dependencies: []
path: ""
torOnly: false
