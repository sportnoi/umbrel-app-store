  - 2.jpg
  - 3.jpg
releaseNotes: >-
  First release of Finance Casa on Umbrel.


  - Next.js frontend served through the Umbrel app proxy on port 3333

  - Python backend and Telegram bot are internal-only, not reachable from the LAN

  - SQLite database and all state persisted under the app's data directory
